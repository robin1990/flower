<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>花花杂交模拟器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f6d5e8 0%, #e8f4f8 100%);
    min-height: 100vh;
    padding: 16px;
    color: #333;
  }
  .app {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 16px;
  }
  .panel {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  .panel h2 {
    font-size: 18px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid #f0c6dc;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .toolbar .stat {
    padding: 4px 10px;
    background: #fff;
    border: 1px solid #e4d4e0;
    border-radius: 6px;
  }
  button {
    cursor: pointer;
    font-family: inherit;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    background: #e88cb4;
    color: #fff;
    font-size: 13px;
    transition: all 0.15s;
  }
  button:hover:not(:disabled) { background: #d67aa2; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  button.secondary { background: #9ec4d8; }
  button.secondary:hover:not(:disabled) { background: #8ab2c6; }
  button.warn { background: #e09c5d; }
  button.harvest-all {
    background: linear-gradient(135deg, #7cc471, #5aad4e);
    font-size: 15px;
    padding: 10px 24px;
    border-radius: 10px;
    font-weight: bold;
    box-shadow: 0 3px 10px rgba(90,173,78,0.3);
  }
  button.harvest-all:hover:not(:disabled) { background: linear-gradient(135deg, #6bb860, #4a9d3e); }

  /* 花圃 */
  .plots {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .plot {
    aspect-ratio: 1;
    border: 2px dashed #c89cb8;
    border-radius: 10px;
    background: #fff9fc;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    text-align: center;
    position: relative;
    min-height: 110px;
  }
  .plot.locked {
    background: #f0f0f0;
    border-color: #ccc;
    color: #999;
  }
  .plot.empty {
    cursor: pointer;
  }
  .plot.empty:hover { background: #fff0f7; border-color: #e88cb4; }
  .plot.growing { background: #fffaea; border: 2px solid #e8c56d; border-style: solid; }
  .plot.ripe { background: #eef9ed; border: 2px solid #7cc471; border-style: solid; }
  .plot .flower-emoji {
    font-size: 28px;
    margin: 3px;
  }
  .plot .plot-info {
    font-size: 11px;
    color: #666;
    line-height: 1.3;
  }
  .plot-actions {
    display: flex;
    gap: 4px;
    margin-top: 4px;
  }
  .plot-actions button { padding: 3px 8px; font-size: 11px; }

  /* 背包 */
  .inventory-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .inventory-tabs button {
    background: #ddd; color: #555; padding: 4px 12px;
  }
  .inventory-tabs button.active { background: #e88cb4; color: #fff; }
  .item-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
    min-height: 80px;
    max-height: 220px;
    overflow-y: auto;
  }
  .item {
    padding: 8px;
    background: #fff;
    border: 1px solid #e4d4e0;
    border-radius: 8px;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
  }
  .item:hover { border-color: #e88cb4; transform: translateY(-2px); }
  .item.selected { border-color: #e88cb4; background: #fff0f7; border-width: 2px; }
  .item .emoji { font-size: 22px; display: block; }
  .item .name { font-size: 11px; margin: 2px 0; }
  .item .count { color: #e88cb4; font-weight: bold; }

  /* 实验室 */
  .lab-slots {
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: center;
    margin: 16px 0;
  }
  .lab-slot {
    width: 90px;
    height: 90px;
    border: 2px dashed #9ec4d8;
    border-radius: 10px;
    background: #f3faff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 11px;
    color: #888;
    position: relative;
  }
  .lab-slot.filled { background: #e0f0fa; border-style: solid; }
  .lab-slot .emoji { font-size: 32px; }
  .lab-slot .name { font-size: 11px; margin-top: 3px; }
  .lab-slot .remove {
    position: absolute;
    top: 2px; right: 2px;
    width: 18px; height: 18px;
    background: #d66; color: #fff;
    border-radius: 50%;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .lab-arrow { font-size: 22px; color: #999; }
  .lab-info {
    text-align: center;
    padding: 10px;
    background: #f9f9f9;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .lab-info strong { color: #e88cb4; font-size: 16px; }

  /* 日志 */
  .log {
    max-height: 200px;
    overflow-y: auto;
    padding: 8px;
    background: #fafafa;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.6;
    border: 1px solid #eee;
  }
  .log-entry { padding: 3px 0; border-bottom: 1px dashed #eee; }
  .log-entry:last-child { border-bottom: none; }
  .log-success { color: #2a8d3a; }
  .log-fail { color: #c65; }
  .log-mutation { color: #c040a0; font-weight: bold; }

  /* 选种弹窗 */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal {
    background: #fff; border-radius: 12px; padding: 20px;
    min-width: 300px; max-width: 500px;
  }
  .modal h3 { margin-bottom: 12px; }
  .modal-close {
    float: right; background: #ccc; padding: 3px 10px;
  }

  h4 { font-size: 13px; margin: 10px 0 6px; color: #666; }
  .hint { font-size: 12px; color: #999; }

  /* Toast 提示 */
  #toastContainer {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .toast {
    min-width: 280px;
    max-width: 420px;
    padding: 20px 28px;
    border-radius: 14px;
    text-align: center;
    font-size: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.22);
    animation: toastIn 0.35s cubic-bezier(.2,1.4,.3,1), toastOut 0.35s ease 1.6s forwards;
  }
  .toast.success {
    background: linear-gradient(135deg, #ffe8f3 0%, #fff5fa 100%);
    border: 2px solid #e88cb4;
    color: #c73c7e;
  }
  .toast.fail {
    background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
    border: 2px solid #bbb;
    color: #666;
  }
  .toast .toast-emoji { font-size: 42px; margin-bottom: 6px; }
  .toast .toast-title { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
  .toast .toast-desc { font-size: 13px; color: inherit; opacity: 0.8; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-20px) scale(0.85); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateY(-20px) scale(0.95); }
  }

  /* 下方面板区域 */
  .bottom-panels {
    max-width: 1400px;
    margin: 16px auto 0;
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 16px;
  }

  /* 商店 */
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
    max-height: 350px;
    overflow-y: auto;
  }
  .shop-item {
    padding: 10px 8px;
    background: #fff;
    border: 1px solid #e4d4e0;
    border-radius: 10px;
    text-align: center;
    font-size: 12px;
    transition: all 0.15s;
  }
  .shop-item.locked {
    background: #f5f5f5;
    border-color: #ddd;
    opacity: 0.5;
  }
  .shop-item .emoji { font-size: 26px; display: block; margin-bottom: 4px; }
  .shop-item .name { font-size: 11px; margin-bottom: 4px; }
  .shop-item .price { color: #d4a017; font-weight: bold; font-size: 12px; margin-bottom: 6px; }
  .shop-item button { padding: 4px 10px; font-size: 11px; }
  .shop-item button.secondary { background: #9ec4d8; }

  /* 配方表 */
  .recipe-table-wrap {
    max-height: 400px;
    overflow-y: auto;
  }
  .recipe-table {
    width: 100%;
    font-size: 12px;
    border-collapse: collapse;
  }
  .recipe-table th, .recipe-table td {
    padding: 6px 8px;
    text-align: center;
    border-bottom: 1px solid #eee;
  }
  .recipe-table th {
    background: #f8f0f5;
    font-weight: 600;
    color: #666;
    position: sticky;
    top: 0;
  }
  .recipe-table td:first-child { text-align: left; }
  .recipe-table input[type="number"] {
    width: 60px;
    padding: 3px 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: monospace;
    font-size: 12px;
    text-align: center;
  }

  /* 轮数和一键收获区 */
  .harvest-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
    padding: 10px 14px;
    background: linear-gradient(135deg, #f0fae8, #e8faf0);
    border-radius: 10px;
    border: 1px solid #c4e6b0;
  }
  .harvest-bar .round-info {
    font-size: 14px;
    font-weight: bold;
    color: #4a7c3f;
  }
  .harvest-bar .round-info span {
    font-size: 22px;
    color: #2d6b22;
    margin-left: 6px;
  }
</style>
</head>
<body>
<div class="app">

  <!-- 左侧：花圃 -->
  <div class="panel" id="gardenPanel">
    <h2>🌻 花圃</h2>
    <div class="toolbar">
      <span class="stat">花圃: <b id="plotCountText">8/8</b></span>
      <span class="stat">花花币: <b id="coinText">0</b> 💰</span>
      <span class="stat" id="nextUnlockText"></span>
      <button class="secondary" onclick="unlockAllPlots()">🔓 解锁全部花圃</button>
      <button class="secondary" onclick="showPlantStats()">📊 种植统计</button>
      <button class="warn" onclick="reset()">重置</button>
    </div>

    <!-- 一键收获 + 轮数 -->
    <div class="harvest-bar">
      <div class="round-info">轮数：<span id="roundText">0</span></div>
      <button class="harvest-all" onclick="harvestAll()" id="harvestAllBtn">🌾 一键收获</button>
      <div class="hint">点击一键收获：成熟所有作物并收获，轮数+1</div>
    </div>

    <div class="plots" id="plots"></div>

    <h4>🎒 背包</h4>
    <div class="inventory-tabs">
      <button class="active" data-tab="seed" onclick="switchTab('seed')">🌱 种子</button>
      <button data-tab="flower" onclick="switchTab('flower')">🌸 花材</button>
    </div>
    <div class="item-list" id="inventory"></div>
  </div>

  <!-- 右侧：实验室 -->
  <div class="panel" id="labPanel">
    <h2>🧪 实验室</h2>
    <p class="hint">从下方花材中选择2朵放入实验室进行杂交</p>

    <div class="lab-slots">
      <div class="lab-slot" id="labSlot0" onclick="clearLabSlot(0)"></div>
      <div class="lab-arrow">➕</div>
      <div class="lab-slot" id="labSlot1" onclick="clearLabSlot(1)"></div>
      <div class="lab-arrow">➡️</div>
      <div class="lab-slot" id="labOutput" style="border-color:#e8c56d;background:#fffbe8;"></div>
    </div>

    <div class="lab-info" id="labInfo">将2朵花材放入左侧槽位</div>

    <div style="text-align:center;margin-bottom:14px;">
      <button onclick="doLab()" id="labBtn" disabled>开始杂交</button>
      <button class="secondary" onclick="doLabX10()" id="labBtnX10" disabled>全部杂交</button>
      <button class="secondary" onclick="showLabStats()">📊 杂交统计</button>
    </div>

    <h4>🌸 花材（点击选择放入实验室）</h4>
    <div class="item-list" id="flowerList"></div>

    <h4>📜 日志 <button class="secondary" onclick="exportLog()" style="font-size:11px;padding:2px 8px;margin-left:8px;">📋 导出日志</button></h4>
    <div class="log" id="log"></div>
  </div>

</div>

<!-- 下方面板：商店 + 配方表 -->
<div class="bottom-panels">
  <!-- 花花币商店 -->
  <div class="panel">
    <h2>🛒 花花币商店</h2>
    <p class="hint" style="margin-bottom:10px;">通过合成获得某花后，解锁该种子的购买权限。价格基于花材当量。</p>
    <div class="shop-grid" id="shopGrid"></div>
  </div>

  <!-- 配方表 -->
  <div class="panel">
    <h2>📋 配方表</h2>
    <p class="hint" style="margin-bottom:10px;">可直接修改成功率和花花币产出，修改即时生效。</p>
    <div class="recipe-table-wrap">
      <table class="recipe-table">
        <thead>
          <tr>
            <th>配方</th>
            <th>产物</th>
            <th>成功率(%)</th>
            <th>花花币(成功)</th>
            <th>花花币(失败)</th>
          </tr>
        </thead>
        <tbody id="recipeTableBody"></tbody>
      </table>
      <button class="secondary" onclick="resetRecipes()" style="margin-top:8px;font-size:12px;">↩ 重置为默认概率</button>
    </div>
  </div>
</div>

<!-- 选种弹窗 -->
<div class="modal-mask" id="seedModal" style="display:none;">
  <div class="modal">
    <button class="modal-close" onclick="closeSeedModal()">×</button>
    <h3>🌱 选择种子</h3>
    <p class="hint" id="seedModalHint">将在第 N 号花圃播种</p>
    <div class="item-list" id="seedChoices" style="max-height:300px;"></div>
  </div>
</div>

<!-- 种植统计弹窗 -->
<div class="modal-mask" id="plantStatsModal" style="display:none;">
  <div class="modal" style="max-width:420px;">
    <button class="modal-close" onclick="closePlantStats()">×</button>
    <h3>📊 种植统计</h3>
    <p class="hint" style="margin-bottom:10px;">每种种子累计种植格数</p>
    <div id="plantStatsContent" style="max-height:400px;overflow-y:auto;"></div>
  </div>
</div>

<!-- 杂交统计弹窗 -->
<div class="modal-mask" id="labStatsModal" style="display:none;">
  <div class="modal" style="max-width:560px;">
    <button class="modal-close" onclick="closeLabStats()">×</button>
    <h3>📊 杂交统计</h3>
    <p class="hint" style="margin-bottom:10px;">每个配方的使用次数、成功/失败统计</p>
    <div id="labStatsContent" style="max-height:450px;overflow-y:auto;"></div>
  </div>
</div>

<!-- Toast 提示容器 -->
<div id="toastContainer"></div>

<script>
// ============ 配方数据 ============
const FLOWERS = {
  A: { id:'A', name:'染井樱',   emoji:'🌸', tier:1, value:1 },
  B: { id:'B', name:'八重樱',   emoji:'🌷', tier:1, value:1 },
  C: { id:'C', name:'河津樱',   emoji:'🌺', tier:2, value:3.08 },
  D: { id:'D', name:'大岛樱',   emoji:'🏵️', tier:2, value:3.08 },
  E: { id:'E', name:'御衣黄樱', emoji:'💮', tier:2, value:3.08 },
  F: { id:'F', name:'枝垂樱',   emoji:'🌹', tier:3, value:9.47 },
  G: { id:'G', name:'雪月樱',   emoji:'❄️', tier:3, value:6.27 },
  H: { id:'H', name:'天照樱',   emoji:'☀️', tier:4, value:78.70 },
  I: { id:'I', name:'星河樱',   emoji:'⭐', tier:4, value:35.84 },
  J: { id:'J', name:'神代樱',   emoji:'🔥', tier:5, value:251.90 },
};

// 配方：输入花A+输入花B -> 输出花，成功率，花花币产出
const RECIPES = [
  // Lv2 (成功率 50%) - 约需5-7轮出齐3种T2
  { a:'A', b:'B', out:'C', rate:0.5, coinSuccess:2, coinFail:2 },
  { a:'A', b:'A', out:'D', rate:0.5, coinSuccess:2, coinFail:2 },
  { a:'B', b:'B', out:'E', rate:0.5, coinSuccess:2, coinFail:2 },
  // Lv3 (成功率 30%) - 约需3-5轮出齐F/G
  { a:'C', b:'D', out:'F', rate:0.25, coinSuccess:3, coinFail:3 },
  { a:'C', b:'E', out:'F', rate:0.25, coinSuccess:3, coinFail:3 },
  { a:'D', b:'E', out:'G', rate:0.25, coinSuccess:3, coinFail:3 },
  { a:'A', b:'E', out:'G', rate:0.25, coinSuccess:3, coinFail:3 },
  // Lv4 (F+G→H/I各10%，总20%；C+F→I 10%)
  { a:'F', b:'G', out:'H', rate:0.075, coinSuccess:5, coinFail:5 },
  { a:'F', b:'G', out:'I', rate:0.075, coinSuccess:5, coinFail:5 },
  { a:'C', b:'F', out:'I', rate:0.15, coinSuccess:5, coinFail:5 },
  // Lv5 (成功率 8%)
  { a:'H', b:'I', out:'J', rate:0.08, coinSuccess:8, coinFail:8 },
  { a:'F', b:'H', out:'J', rate:0.08, coinSuccess:8, coinFail:8 },
];

// 商店价格：T2=20, T3=40, T4=80, T5=150
function shopPrice(fid) {
  const tier = FLOWERS[fid].tier;
  return [0, 0, 20, 40, 80, 150][tier];
}

// 花圃解锁条件 - 全部默认解锁（固定8花圃）
const PLOT_UNLOCK = [0, 0, 0, 0, 0, 0, 0, 0];

// 配方查找
function findRecipes(a, b) {
  return RECIPES.filter(r =>
    (r.a === a && r.b === b) || (r.a === b && r.b === a)
  );
}
function findRecipe(a, b) {
  return findRecipes(a, b)[0];
}
function totalRateOf(recipes) {
  return recipes.reduce((s, r) => s + r.rate, 0);
}
// 按概率随机选一个成功的输出
// 保底配方：这些配方组合连续失败14次后第15次必成功
const PITY_RECIPES = { 'H+I': 15, 'F+H': 15 };

function rollRecipes(recipes, a, b) {
  // 检查保底
  const pityKey = [a, b].sort().join('+');
  const pityMax = PITY_RECIPES[pityKey];
  if (pityMax && (state.pity[pityKey] || 0) >= pityMax - 1) {
    // 保底触发，必定成功
    state.pity[pityKey] = 0;
    return recipes[0]; // 返回第一个可能的配方
  }

  const r = Math.random();
  let acc = 0;
  for (const rec of recipes) {
    acc += rec.rate;
    if (r < acc) {
      // 成功，重置保底计数
      if (pityMax) state.pity[pityKey] = 0;
      return rec;
    }
  }
  // 失败，保底计数+1
  if (pityMax) state.pity[pityKey] = (state.pity[pityKey] || 0) + 1;
  return null;
}

function recipesUsing(fid) {
  return RECIPES.filter(r => r.a === fid || r.b === fid);
}

// ============ 游戏状态 ============
const MAX_PLOTS = 8;
const state = {
  plotCount: 8,
  plots: [],
  seeds: { A: 999, B: 999 },
  flowers: {},
  coins: 0,
  labSlots: [null, null],
  unlockedSeeds: new Set(['A','B']),
  // 通过合成获得过的花（解锁商店用）
  synthUnlocked: new Set(),
  plantedFlowers: new Set(['A','B']),
  currentTab: 'seed',
  selectingPlotIdx: -1,
  logs: [],
  round: 0,
  stats: {
    labCount: 0,
    plantStats: {},   // { fid: count } 每种种子种了多少格
    recipeStats: {},  // { "A+B→C": { used:0, success:0, fail:0 } } 每个配方使用统计
    productStats: {}, // { fid: count } 杂交产出每种花的次数
  },
  pity: {},  // 保底计数器 { "H+I":连续失败次数, "F+H":连续失败次数 }
};

function initPlots() {
  for (let i = 0; i < MAX_PLOTS; i++) {
    state.plots.push({ seed: null, status: 'empty', result: null });
  }
}

// ============ 渲染 ============
function render() {
  renderPlots();
  renderInventory();
  renderFlowerList();
  renderLab();
  renderTopStats();
  renderLog();
  renderShop();
  renderRecipeTable();
  document.getElementById('roundText').textContent = state.round;
}

function renderTopStats() {
  document.getElementById('plotCountText').textContent = state.plotCount + '/' + MAX_PLOTS;
  document.getElementById('coinText').textContent = state.coins;
  const nextEl = document.getElementById('nextUnlockText');
  if (state.plotCount >= MAX_PLOTS) {
    nextEl.textContent = '花圃已全部解锁';
  } else {
    const need = PLOT_UNLOCK[state.plotCount];
    nextEl.innerHTML = `下个花圃: 杂交累计 <b>${state.stats.labCount}/${need}</b>`;
  }
}

function renderPlots() {
  const container = document.getElementById('plots');
  container.innerHTML = '';
  for (let i = 0; i < MAX_PLOTS; i++) {
    const p = state.plots[i];
    const div = document.createElement('div');
    div.className = 'plot';
    if (i >= state.plotCount) {
      const need = PLOT_UNLOCK[i] || 99999;
      div.classList.add('locked');
      div.innerHTML = `<div>🔒</div><div class="plot-info">实验室杂交<br>累计 ${need} 次解锁</div>`;
    } else if (p.status === 'empty') {
      div.classList.add('empty');
      div.innerHTML = `<div style="font-size:32px;color:#c89cb8;">+</div><div class="plot-info">点击种植</div>`;
      div.onclick = () => openSeedModal(i);
    } else if (p.status === 'growing') {
      const f = FLOWERS[p.seed];
      div.classList.add('growing');
      div.innerHTML = `
        <div class="flower-emoji">${f.emoji}</div>
        <div class="plot-info">${f.name}<br><span class="hint">生长中</span></div>
      `;
    } else if (p.status === 'ripe') {
      div.classList.add('ripe');
      const r = p.result;
      const f = FLOWERS[p.seed];
      if (r.mutation) {
        const mf = FLOWERS[r.mutation];
        div.innerHTML = `
          <div class="flower-emoji">${mf.emoji}✨</div>
          <div class="plot-info log-mutation">突变!<br>${mf.name}</div>
        `;
      } else {
        div.innerHTML = `
          <div class="flower-emoji">${f.emoji}</div>
          <div class="plot-info">已成熟<br>${f.name}×4</div>
        `;
      }
    }
    container.appendChild(div);
  }
}

function renderInventory() {
  const tab = state.currentTab;
  const container = document.getElementById('inventory');
  container.innerHTML = '';
  const dict = tab === 'seed' ? state.seeds : state.flowers;
  const entries = Object.entries(dict).filter(([k,v]) => v > 0)
    .sort((a,b) => FLOWERS[a[0]].tier - FLOWERS[b[0]].tier);
  if (entries.length === 0) {
    container.innerHTML = '<p class="hint">暂无物品</p>';
    return;
  }
  for (const [fid, count] of entries) {
    const f = FLOWERS[fid];
    const div = document.createElement('div');
    div.className = 'item';
    const countText = (tab === 'seed' && f.tier === 1) ? '∞' : count;
    div.innerHTML = `<span class="emoji">${f.emoji}</span>
      <div class="name">${f.name}</div>
      <div class="count">×${countText}</div>`;
    if (tab === 'seed') {
      div.style.cursor = 'pointer';
      div.title = '点击一键种满';
      div.onclick = () => quickPlant(fid);
    }
    container.appendChild(div);
  }
}

// 一键种满：点击种子自动种到所有空花圃
function quickPlant(fid) {
  const f = FLOWERS[fid];
  const isInfinite = f.tier === 1; // T1种子无限
  let planted = 0;
  for (let i = 0; i < state.plotCount; i++) {
    if (state.plots[i].status !== 'empty') continue;
    if (!isInfinite) {
      if ((state.seeds[fid] || 0) <= 0) break;
      state.seeds[fid]--;
    }
    state.plots[i].seed = fid;
    state.plots[i].status = 'growing';
    state.plots[i].result = null;
    state.plantedFlowers.add(fid);
    state.stats.plantStats[fid] = (state.stats.plantStats[fid] || 0) + 1;
    planted++;
  }
  if (planted > 0) {
    log(`一键种植: ${f.name}×${planted}`, 'log-success');
  } else {
    log(`没有空花圃可种植`, 'log-fail');
  }
  render();
}

function renderFlowerList() {
  const container = document.getElementById('flowerList');
  container.innerHTML = '';
  const entries = Object.entries(state.flowers).filter(([k,v]) => v > 0)
    .sort((a,b) => FLOWERS[a[0]].tier - FLOWERS[b[0]].tier);
  if (entries.length === 0) {
    container.innerHTML = '<p class="hint">暂无花材，请先在花圃收获</p>';
    return;
  }
  for (const [fid, count] of entries) {
    const f = FLOWERS[fid];
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<span class="emoji">${f.emoji}</span>
      <div class="name">${f.name}</div>
      <div class="count">×${count}</div>`;
    div.onclick = () => putInLab(fid);
    container.appendChild(div);
  }
}

function renderLab() {
  for (let i = 0; i < 2; i++) {
    const slot = document.getElementById('labSlot' + i);
    const fid = state.labSlots[i];
    if (fid) {
      const f = FLOWERS[fid];
      slot.className = 'lab-slot filled';
      slot.innerHTML = `<span class="emoji">${f.emoji}</span><div class="name">${f.name}</div>
        <div class="remove" onclick="event.stopPropagation();clearLabSlot(${i})">×</div>`;
    } else {
      slot.className = 'lab-slot';
      slot.innerHTML = '<div>+</div><div>点击花材放入</div>';
    }
  }
  const out = document.getElementById('labOutput');
  const info = document.getElementById('labInfo');
  const btn = document.getElementById('labBtn');
  const btnX = document.getElementById('labBtnX10');
  if (state.labSlots[0] && state.labSlots[1]) {
    const recs = findRecipes(state.labSlots[0], state.labSlots[1]);
    if (recs.length > 0) {
      const totalRate = totalRateOf(recs);
      if (recs.length === 1) {
        const rec = recs[0];
        const f = FLOWERS[rec.out];
        out.innerHTML = `<span class="emoji">${f.emoji}</span><div class="name">${f.name}</div>`;
        info.innerHTML = `配方: <strong>${FLOWERS[rec.a].name}+${FLOWERS[rec.b].name}→${f.name}</strong> 成功率 <strong>${(rec.rate*100)}%</strong> 💰成功${rec.coinSuccess}/失败${rec.coinFail}`;
      } else {
        const outsHtml = recs.map(r => `<span class="emoji" style="font-size:24px;">${FLOWERS[r.out].emoji}</span>`).join('');
        out.innerHTML = `${outsHtml}<div class="name">多种产物</div>`;
        const detail = recs.map(r => `${FLOWERS[r.out].name}(${(r.rate*100)}%)`).join(' / ');
        info.innerHTML = `配方: <strong>${FLOWERS[recs[0].a].name}+${FLOWERS[recs[0].b].name}</strong>→ ${detail}, 总成功率 <strong>${(totalRate*100)}%</strong>`;
      }
      btn.disabled = false;
      btnX.disabled = false;
    } else {
      out.innerHTML = '<div>❌</div><div class="name">无配方</div>';
      info.textContent = '这两种花材没有可用配方';
      btn.disabled = true;
      btnX.disabled = true;
    }
  } else {
    out.innerHTML = '<div>?</div><div class="name">产出预览</div>';
    info.textContent = '将2朵花材放入左侧槽位';
    btn.disabled = true;
    btnX.disabled = true;
  }
}

function renderLog() {
  const container = document.getElementById('log');
  container.innerHTML = '';
  for (const entry of state.logs.slice(-30).reverse()) {
    const div = document.createElement('div');
    div.className = 'log-entry ' + (entry.cls || '');
    div.textContent = entry.text;
    container.appendChild(div);
  }
}

function renderShop() {

  const shopFlowers = Object.values(FLOWERS).filter(f => f.tier >= 2)

        <div class="name">${f.name} 种子</div>

        <button class="secondary" onclick="buyFromShop('${f.id}')">购买</button>
      `;

      div.innerHTML = `
        <span class="emoji">❓</span>

function renderRecipeTable() {

  RECIPES.forEach((rec, idx) => {

function log(text, cls) {
  state.logs.push({ text, cls, round: state.round });
  if (state.logs.length > 500) state.logs.shift();
  renderLog();
}

// 导出完整操作日志
// ============ 统计弹窗 ============
function showPlantStats() {
  const container = document.getElementById('plantStatsContent');
  const ps = state.stats.plantStats;
  const entries = Object.keys(FLOWERS)
    .filter(fid => (ps[fid] || 0) > 0)
    .sort((a, b) => FLOWERS[a].tier - FLOWERS[b].tier || (ps[b]||0) - (ps[a]||0));
  
  if (entries.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#999;">暂无种植记录</p>';
  } else {
    const total = entries.reduce((s, fid) => s + (ps[fid]||0), 0);
    let html = '<table class="recipe-table"><thead><tr><th>种子</th><th>阶级</th><th>种植格数</th><th>占比</th></tr></thead><tbody>';
    for (const fid of entries) {
      const f = FLOWERS[fid];
      const count = ps[fid] || 0;
      const pct = (count / total * 100).toFixed(1);
      html += `<tr><td style="text-align:left;">${f.emoji} ${f.name}</td><td>T${f.tier}</td><td><b>${count}</b></td><td>${pct}%</td></tr>`;
    }
    html += `<tr style="border-top:2px solid #ddd;font-weight:bold;"><td style="text-align:left;">合计</td><td></td><td>${total}</td><td>100%</td></tr>`;
    html += '</tbody></table>';
    container.innerHTML = html;
  }
  document.getElementById('plantStatsModal').style.display = 'flex';
}

function closePlantStats() {
  document.getElementById('plantStatsModal').style.display = 'none';
}

function showLabStats() {
  const container = document.getElementById('labStatsContent');
  const rs = state.stats.recipeStats;
  const ps = state.stats.productStats;
  
  // 按配方组合分组：将同一对材料的成功和失败合并
  const grouped = {}; // key: "花A+花B" → { total, success, fail, products: { name: count } }
  for (const [key, data] of Object.entries(rs)) {
    const parts = key.split('→');
    const combo = parts[0]; // "花A+花B"
    const product = parts[1]; // 产物名 或 "失败"
    if (!grouped[combo]) grouped[combo] = { total:0, success:0, fail:0, products:{} };
    grouped[combo].total += data.used;
    grouped[combo].success += data.success;
    grouped[combo].fail += data.fail;
    if (product !== '失败' && data.success > 0) {
      grouped[combo].products[product] = (grouped[combo].products[product] || 0) + data.success;
    }
  }
  
  const combos = Object.keys(grouped);
  if (combos.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#999;">暂无杂交记录</p>';
  } else {
    let html = '<table class="recipe-table"><thead><tr><th>配方组合</th><th>总次数</th><th>成功</th><th>失败</th><th>成功率</th><th>产物明细</th></tr></thead><tbody>';
    let totalAll = 0, successAll = 0, failAll = 0;
    for (const combo of combos) {
      const g = grouped[combo];
      totalAll += g.total;
      successAll += g.success;
      failAll += g.fail;
      const rate = g.total > 0 ? (g.success / g.total * 100).toFixed(1) : '0.0';
      const prodList = Object.entries(g.products).map(([name, cnt]) => `${name}×${cnt}`).join(', ') || '-';
      html += `<tr><td style="text-align:left;white-space:nowrap;">${combo}</td><td>${g.total}</td><td style="color:#2a7">${g.success}</td><td style="color:#c55">${g.fail}</td><td><b>${rate}%</b></td><td style="font-size:11px;">${prodList}</td></tr>`;
    }
    html += `<tr style="border-top:2px solid #ddd;font-weight:bold;"><td style="text-align:left;">合计</td><td>${totalAll}</td><td style="color:#2a7">${successAll}</td><td style="color:#c55">${failAll}</td><td>${totalAll>0?(successAll/totalAll*100).toFixed(1):'0.0'}%</td><td></td></tr>`;
    html += '</tbody></table>';
    
    // 产物总览
    const prodEntries = Object.keys(FLOWERS).filter(fid => (ps[fid]||0) > 0).sort((a,b) => FLOWERS[a].tier - FLOWERS[b].tier);
    if (prodEntries.length > 0) {
      html += '<h4 style="margin-top:14px;font-size:13px;">🌸 产物总览</h4>';
      html += '<table class="recipe-table"><thead><tr><th>花名</th><th>阶级</th><th>杂交产出次数</th></tr></thead><tbody>';
      for (const fid of prodEntries) {
        const f = FLOWERS[fid];
        html += `<tr><td style="text-align:left;">${f.emoji} ${f.name}</td><td>T${f.tier}</td><td><b>${ps[fid]}</b></td></tr>`;
      }
      html += '</tbody></table>';
    }
    container.innerHTML = html;
  }
  document.getElementById('labStatsModal').style.display = 'flex';
}

function closeLabStats() {
  document.getElementById('labStatsModal').style.display = 'none';
}

function exportLog() {
  let report = `=== 🌸 杂交模拟器操作日志 ===\n`;
  report += `导出时间: ${new Date().toLocaleString()}\n`;
  report += `当前轮数: ${state.round}\n`;
  report += `花圃数量: ${state.plotCount}/${MAX_PLOTS}\n`;
  report += `杂交次数: ${state.stats.labCount}\n`;
  report += `花花币: ${state.coins}\n`;
  report += `\n--- 背包状态 ---\n`;
  report += `种子: ` + Object.entries(state.seeds).filter(([k,v])=>v>0).map(([k,v])=>`${FLOWERS[k].name}×${k==='A'||k==='B'?'∞':v}`).join(', ') + '\n';
  report += `花材: ` + Object.entries(state.flowers).filter(([k,v])=>v>0).map(([k,v])=>`${FLOWERS[k].name}×${v}`).join(', ') + '\n';
  report += `已解锁图鉴: ` + Array.from(state.unlockedSeeds).map(k=>FLOWERS[k].name).join(', ') + '\n';
  report += `\n--- 操作记录 (共${state.logs.length}条) ---\n`;
  let lastRound = -1;
  for (const entry of state.logs) {
    if (entry.round !== lastRound) {
      report += `\n【第${entry.round}轮】\n`;
      lastRound = entry.round;
    }
    report += `  ${entry.text}\n`;
  }
  // 复制到剪贴板
  navigator.clipboard.writeText(report).then(() => {
    showToast({ type: 'success', emoji: '📋', title: '日志已复制到剪贴板', desc: '可直接粘贴给AI分析' });
  }).catch(() => {
    // 备选：弹窗显示
    const w = window.open('', '_blank', 'width=600,height=400');
    w.document.write(`<pre style="white-space:pre-wrap;font-size:12px;">${report.replace(/</g,'&lt;')}</pre>`);
  });
}

function showToast({ type, emoji, title, desc }) {
  const container = document.getElementById('toastContainer');
  const div = document.createElement('div');
  div.className = 'toast ' + (type || 'success');
  div.innerHTML = `
    <div class="toast-emoji">${emoji || ''}</div>
    <div class="toast-title">${title || ''}</div>
    ${desc ? `<div class="toast-desc">${desc}</div>` : ''}
  `;
  container.appendChild(div);
  setTimeout(() => div.remove(), 2000);
}

// ============ 操作 ============
function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.inventory-tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  renderInventory();
}

function openSeedModal(plotIdx) {
  state.selectingPlotIdx = plotIdx;
  document.getElementById('seedModalHint').textContent = `将在第 ${plotIdx+1} 号花圃播种（选择1个种子）`;
  const container = document.getElementById('seedChoices');
  container.innerHTML = '';
  for (const fid of Array.from(state.unlockedSeeds).sort((a,b) => FLOWERS[a].tier - FLOWERS[b].tier)) {
    const count = state.seeds[fid] || 0;
    if (count <= 0) continue;
    const f = FLOWERS[fid];
    const div = document.createElement('div');
    div.className = 'item';
    const countText = f.tier === 1 ? '∞' : count;
    div.innerHTML = `<span class="emoji">${f.emoji}</span>
      <div class="name">${f.name}</div>
      <div class="count">×${countText}</div>`;
    div.onclick = () => {
      plantSeed(state.selectingPlotIdx, fid);
      closeSeedModal();
    };
    container.appendChild(div);
  }
  document.getElementById('seedModal').style.display = 'flex';
}

function closeSeedModal() {
  document.getElementById('seedModal').style.display = 'none';
}

function plantSeed(plotIdx, fid) {
  if (FLOWERS[fid].tier > 1) {
    if ((state.seeds[fid] || 0) <= 0) { log('种子不足', 'log-fail'); return; }
    state.seeds[fid]--;
  }
  state.stats.plantStats[fid] = (state.stats.plantStats[fid] || 0) + 1;
  const p = state.plots[plotIdx];
  p.seed = fid; p.status = 'growing'; p.result = null;
  state.plantedFlowers.add(fid);
  log(`花圃${plotIdx+1}: 种下${FLOWERS[fid].name}`);
  render();
}

// 成熟一个花圃（种植不发生变异，只产出本身花材）
function maturePlot(plotIdx) {
  const p = state.plots[plotIdx];
  if (p.status !== 'growing') return;
  p.result = { mutation: null, pair: null };
  p.status = 'ripe';
}

// 收获一个花圃
function harvestPlot(plotIdx) {
  const p = state.plots[plotIdx];
  if (p.status !== 'ripe') return;
  const r = p.result;
  const seedFid = p.seed;
  if (r.mutation) {
    const mid = r.mutation;
    state.flowers[mid] = (state.flowers[mid] || 0) + 2;
    state.flowers[seedFid] = (state.flowers[seedFid] || 0) + 2;
    state.seeds[mid] = (state.seeds[mid] || 0) + 1;
    state.unlockedSeeds.add(mid);
    state.synthUnlocked.add(mid);
    log(`花圃${plotIdx+1}: 🎉突变! 获得 ${FLOWERS[mid].name}×2 + ${FLOWERS[seedFid].name}×2 + 种子×1`, 'log-mutation');
  } else {
    state.flowers[seedFid] = (state.flowers[seedFid] || 0) + 2;
    log(`花圃${plotIdx+1}: 收获 ${FLOWERS[seedFid].name}×2`);
  }
  p.seed = null; p.status = 'empty'; p.result = null;
}

// 一键收获：成熟所有 growing → 收获所有 ripe → 轮数+1
function harvestAll() {
  // 1. 成熟所有正在生长的
  let growing = 0;
  for (let i = 0; i < state.plotCount; i++) {
    if (state.plots[i].status === 'growing') {
      maturePlot(i);
      growing++;
    }
  }
  // 2. 收获所有成熟的
  let harvested = 0;
  for (let i = 0; i < state.plotCount; i++) {
    if (state.plots[i].status === 'ripe') {
      harvestPlot(i);
      harvested++;
    }
  }
  if (harvested > 0) {
    state.round++;
    log(`🌾 第 ${state.round} 轮收获完成，共收获 ${harvested} 块花圃`, 'log-success');
  } else {
    // 调试：显示每个花圃的状态
    const statuses = state.plots.map((p,i) => `${i+1}:${p.status}`).join(',');
    log(`没有可收获的花圃(状态:${statuses})，请先种植种子`, 'log-fail');
  }
  render();
}

function putInLab(fid) {
  if ((state.flowers[fid] || 0) <= 0) return;
  const idx = state.labSlots[0] === null ? 0 : (state.labSlots[1] === null ? 1 : -1);
  if (idx === -1) { log('实验室已满', 'log-fail'); return; }
  state.flowers[fid]--;
  state.labSlots[idx] = fid;
  renderFlowerList();
  renderLab();
  renderInventory();
}

function clearLabSlot(idx) {
  const fid = state.labSlots[idx];
  if (!fid) return;
  state.flowers[fid] = (state.flowers[fid] || 0) + 1;
  state.labSlots[idx] = null;
  renderFlowerList();
  renderLab();
  renderInventory();
}

// 实验室杂交 - 新逻辑：成功产出花材×1+种子×1，无论成功失败都给花花币
function doLab() {
  const [a, b] = state.labSlots;
  if (!a || !b) return;
  const recs = findRecipes(a, b);
  if (recs.length === 0) return;
  state.labSlots[0] = null;
  state.labSlots[1] = null;
  state.stats.labCount++;

  const rec = rollRecipes(recs);
  if (rec) {
    // 统计配方使用
    const recKey = `${FLOWERS[a].name}+${FLOWERS[b].name}→${FLOWERS[rec.out].name}`;
    if (!state.stats.recipeStats[recKey]) state.stats.recipeStats[recKey] = { used:0, success:0, fail:0 };
    state.stats.recipeStats[recKey].used++;
    state.stats.recipeStats[recKey].success++;
    state.stats.productStats[rec.out] = (state.stats.productStats[rec.out] || 0) + 1;
    // 成功：花材×1 + 种子×1 + 花花币
    const mid = rec.out;
    state.flowers[mid] = (state.flowers[mid] || 0) + 1;
    state.seeds[mid] = (state.seeds[mid] || 0) + 1;
    state.unlockedSeeds.add(mid);
    state.synthUnlocked.add(mid);
    const coin = rec.coinSuccess;
    state.coins += coin;
    log(`🧪杂交成功! ${FLOWERS[a].name}+${FLOWERS[b].name}→${FLOWERS[mid].name}×1 + 种子×1 + 💰×${coin}`, 'log-success');
    showToast({
      type: 'success',
      emoji: FLOWERS[mid].emoji + '✨',
      title: '杂交成功！',
      desc: `获得 ${FLOWERS[mid].name} ×1 + 种子×1 + 💰${coin}`,
    });
  } else {
    // 统计配方使用（失败）
    const failKey = `${FLOWERS[a].name}+${FLOWERS[b].name}→失败`;
    if (!state.stats.recipeStats[failKey]) state.stats.recipeStats[failKey] = { used:0, success:0, fail:0 };
    state.stats.recipeStats[failKey].used++;
    state.stats.recipeStats[failKey].fail++;
    // 失败：花材消耗 + 花花币
    const coin = recs[0].coinFail;
    state.coins += coin;
    log(`🧪杂交失败，${FLOWERS[a].name}+${FLOWERS[b].name} 消耗，获得💰×${coin}`, 'log-fail');
    showToast({
      type: 'fail',
      emoji: '💰',
      title: '杂交失败',
      desc: `获得花花币 ×${coin}`,
    });
  }
  checkPlotUnlock();
  render();
}

function doLabX10() {
  const [a, b] = state.labSlots;
  if (!a || !b) return;
  const recs = findRecipes(a, b);
  if (recs.length === 0) return;
  
  // 计算最多能杂交几次（第1次用lab里的花材，之后从库存扣）
  let extraTimes;
  if (a === b) {
    // 同种花材：每次需要2朵
    extraTimes = Math.floor((state.flowers[a] || 0) / 2);
  } else {
    // 不同花材：每次各需要1朵
    extraTimes = Math.min(state.flowers[a] || 0, state.flowers[b] || 0);
  }
  const times = 1 + extraTimes;
  
  let success = 0;
  let coinGain = 0;
  for (let i = 0; i < times; i++) {
    state.stats.labCount++;
    const rec = rollRecipes(recs, a, b);
    if (rec) {
      const mid = rec.out;
      // 统计配方使用
      const recKey = `${FLOWERS[a].name}+${FLOWERS[b].name}→${FLOWERS[mid].name}`;
      if (!state.stats.recipeStats[recKey]) state.stats.recipeStats[recKey] = { used:0, success:0, fail:0 };
      state.stats.recipeStats[recKey].used++;
      state.stats.recipeStats[recKey].success++;
      state.stats.productStats[mid] = (state.stats.productStats[mid] || 0) + 1;
      state.flowers[mid] = (state.flowers[mid] || 0) + 1;
      state.seeds[mid] = (state.seeds[mid] || 0) + 1;
      state.unlockedSeeds.add(mid);
      state.synthUnlocked.add(mid);
      success++;
      coinGain += rec.coinSuccess;
      state.coins += rec.coinSuccess;
    } else {
      // 统计失败
      const failKey = `${FLOWERS[a].name}+${FLOWERS[b].name}→失败`;
      if (!state.stats.recipeStats[failKey]) state.stats.recipeStats[failKey] = { used:0, success:0, fail:0 };
      state.stats.recipeStats[failKey].used++;
      state.stats.recipeStats[failKey].fail++;
      const c = recs[0].coinFail;
      state.coins += c;
      coinGain += c;
    }
    // 第一次用的是 labSlots 里的花材，之后从库存扣
    if (i > 0) {
      state.flowers[a] = (state.flowers[a] || 0) - 1;
      if (a !== b) {
        state.flowers[b] = (state.flowers[b] || 0) - 1;
      } else {
        // 同种花材需要扣2朵
        state.flowers[a] = (state.flowers[a] || 0) - 1;
      }
    }
  }
  state.labSlots[0] = null;
  state.labSlots[1] = null;
  log(`🧪全部杂交×${times}: 成功${success}次, 失败${times-success}次, 💰+${coinGain}`, success > 0 ? 'log-success' : 'log-fail');
  showToast({
    type: success > 0 ? 'success' : 'fail',
    emoji: success > 0 ? (FLOWERS[recs[0].out].emoji + '✨') : '💰',
    title: `全部杂交 ×${times}`,
    desc: `成功 ${success} · 失败 ${times - success} · 💰+${coinGain}`,
  });
  checkPlotUnlock();
  render();
}

// 花圃解锁
function checkPlotUnlock() {
  for (let i = state.plotCount; i < MAX_PLOTS; i++) {
    const need = PLOT_UNLOCK[i];
    if (state.stats.labCount >= need) {
      state.plotCount = i + 1;
      log(`🎊 解锁第${state.plotCount}个花圃! (累计杂交${state.stats.labCount}次)`, 'log-success');
      showToast({
        type: 'success', emoji: '🌿✨',
        title: `解锁第 ${state.plotCount} 个花圃`,
        desc: `累计杂交 ${state.stats.labCount} 次达成`,
      });
    } else {
      break;
    }
  }
}

// 一键解锁所有花圃
function unlockAllPlots() {
  if (state.plotCount >= MAX_PLOTS) {
    showToast({ type: 'info', emoji: '🌿', title: '花圃已全部解锁', desc: '' });
    return;
  }
  state.plotCount = MAX_PLOTS;
  log('🔓 一键解锁全部花圃!', 'log-success');
  showToast({ type: 'success', emoji: '🔓✨', title: '全部花圃已解锁', desc: `共 ${MAX_PLOTS} 个花圃` });
  render();
}

// 商店购买
function buyFromShop(fid) {
  const price = shopPrice(fid);
  if (state.coins < price) {
    log(`花花币不足！需要 ${price}，当前 ${state.coins}`, 'log-fail');
    showToast({ type: 'fail', emoji: '💰', title: '花花币不足', desc: `需要 ${price}，当前 ${state.coins}` });
    return;
  }
  state.coins -= price;
  state.seeds[fid] = (state.seeds[fid] || 0) + 1;
  state.unlockedSeeds.add(fid);
  log(`🛒 购买 ${FLOWERS[fid].name} 种子×1，花费💰${price}`, 'log-success');
  showToast({ type: 'success', emoji: FLOWERS[fid].emoji, title: '购买成功', desc: `${FLOWERS[fid].name} 种子 ×1` });
  render();
}

// 配方表编辑 + 持久化
function saveRecipes() {
  const data = RECIPES.map(r => ({ rate: r.rate, coinSuccess: r.coinSuccess, coinFail: r.coinFail }));
  localStorage.setItem('sim_recipes', JSON.stringify(data));
}
function loadRecipes() {
  const raw = localStorage.getItem('sim_recipes');
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    data.forEach((d, i) => {
      if (i < RECIPES.length) {
        if (d.rate !== undefined) RECIPES[i].rate = d.rate;
        if (d.coinSuccess !== undefined) RECIPES[i].coinSuccess = d.coinSuccess;
        if (d.coinFail !== undefined) RECIPES[i].coinFail = d.coinFail;
      }
    });
  } catch(e) {}
}
function updateRecipeRate(idx, val) {
  const v = parseFloat(val);
  if (isNaN(v) || v < 0 || v > 100) return;
  RECIPES[idx].rate = v / 100;
  saveRecipes();
  renderLab();
}
function updateRecipeCoinSuccess(idx, val) {
  const v = parseInt(val);
  if (isNaN(v) || v < 0) return;
  RECIPES[idx].coinSuccess = v;
  saveRecipes();
}
function updateRecipeCoinFail(idx, val) {
  const v = parseInt(val);
  if (isNaN(v) || v < 0) return;
  RECIPES[idx].coinFail = v;
  saveRecipes();
}
function resetRecipes() {
  if (!confirm('确定重置所有配方为默认概率？')) return;
  localStorage.removeItem('sim_recipes');
  // 恢复默认值
  const defaults = [
    {rate:0.15,coinSuccess:2,coinFail:2},{rate:0.15,coinSuccess:2,coinFail:2},{rate:0.15,coinSuccess:2,coinFail:2},
    {rate:0.30,coinSuccess:3,coinFail:3},{rate:0.30,coinSuccess:3,coinFail:3},{rate:0.30,coinSuccess:3,coinFail:3},{rate:0.30,coinSuccess:3,coinFail:3},
    {rate:0.10,coinSuccess:5,coinFail:5},{rate:0.10,coinSuccess:5,coinFail:5},{rate:0.10,coinSuccess:5,coinFail:5},
    {rate:0.08,coinSuccess:8,coinFail:8},{rate:0.08,coinSuccess:8,coinFail:8},
  ];
  defaults.forEach((d, i) => {
    if (i < RECIPES.length) { RECIPES[i].rate = d.rate; RECIPES[i].coinSuccess = d.coinSuccess; RECIPES[i].coinFail = d.coinFail; }
  });
  renderRecipeTable();
  renderLab();
  log('配方已重置为默认概率', 'log-success');
}

function reset() {
  if (!confirm('确定重置所有进度？')) return;
  state.plotCount = 8;
  state.plots = [];
  initPlots();
  state.seeds = { A: 999, B: 999 };
  state.flowers = {};
  state.coins = 0;
  state.labSlots = [null, null];
  state.unlockedSeeds = new Set(['A','B']);
  state.synthUnlocked = new Set();
  state.plantedFlowers = new Set(['A','B']);
  state.logs = [];
  state.round = 0;
  state.stats = { labCount: 0, plantStats: {}, recipeStats: {}, productStats: {} };
  state.pity = {};
  log('已重置');
  render();
}

// ============ 启动 ============
loadRecipes();
initPlots();
render();
log('欢迎来到花花杂交模拟器！种下种子后点击"一键收获"推进轮次');
</script>
